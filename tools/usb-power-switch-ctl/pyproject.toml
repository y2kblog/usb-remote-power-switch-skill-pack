[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-power-switch-ctl"
version = "0.1.0"
description = "CLI for USB Remote Power Switch"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.scripts]
usb-power-switch-ctl = "usb_power_switch_ctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["usb_power_switch_ctl*"]
