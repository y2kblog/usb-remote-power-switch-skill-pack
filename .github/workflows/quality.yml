name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: tools/usb-power-switch-ctl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/usb-power-switch-ctl/pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Smoke test installed entry point
        run: usb-power-switch-ctl --help
      - name: Run unit tests
        run: python -I -m unittest discover -s tests -v

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/usb-power-switch-ctl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/usb-power-switch-ctl/pyproject.toml
      - name: Install package and quality tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check usb_power_switch_ctl tests ../../scripts/bootstrap.py
      - name: Type check
        run: python -m mypy usb_power_switch_ctl ../../scripts/bootstrap.py
      - name: Test with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: python -m coverage report -m
      - name: Audit installed dependencies
        run: python -m pip_audit . --progress-spinner off --strict
      - name: Check WSL preflight shell syntax
        run: bash -n ../../scripts/wsl2-preflight.sh
